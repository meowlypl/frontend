<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />

    <title>Meowly</title>

    <meta
      name="description"
      content="Pomagaj kotom w swojej okolicy."
    />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <link rel="icon" href="logo.png" type="image/png" />

    <!-- iPhone -->
    <link rel="apple-touch-icon" href="logo.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="default"
    />
    <meta name="apple-mobile-web-app-title" content="Meowly" />

    <!-- Android -->
    <meta name="theme-color" content="#ff8a00" />

    <!-- Facebook -->
    <meta property="og:title" content="Meowly" />
    <meta
      property="og:description"
      content="Pomagaj kotom w swojej okolicy."
    />
    <meta
      property="og:image"
      content="https://meowly.com.pl/og-image.png"
    />
    <meta property="og:type" content="website" />

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=dark_mode,light_mode" />
    <script>
      document.documentElement.classList.toggle(
        "dark",
        localStorage.theme === "dark" || (!("theme" in localStorage) && window.matchMedia("(prefers-color-scheme: dark)").matches),
      )
    </script>
  </head>

  <body class="bg-light-base dark:bg-base">
    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
